name: RSS Core + RAY Android Build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rss-file-manager-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build RSS File Manager
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: rss-file-manager-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  rss-core-ray:
    name: RSS Core + RAY handshake
    needs: build
    runs-on: ubuntu-latest
    env:
      RSS_CORE_URL: ${{ vars.RSS_CORE_URL }}
      RSS_CORE_RAY_DISPATCH_URL: ${{ vars.RSS_CORE_RAY_DISPATCH_URL }}
      RSS_CORE_TOKEN: ${{ secrets.RSS_CORE_TOKEN }}
    steps:
      - name: Check RSS Core / RAY status
        shell: bash
        run: |
          set -euo pipefail
          CORE_URL="${RSS_CORE_URL:-https://rsscore.cv}"
          STATUS_URL="${CORE_URL%/}/api/v1/ray/status"

          echo "Checking RSS Core RAY status: $STATUS_URL"
          if [ -n "${RSS_CORE_TOKEN:-}" ]; then
            curl --fail --silent --show-error \
              --header "Authorization: Bearer ${RSS_CORE_TOKEN}" \
              --header "Accept: application/json" \
              "$STATUS_URL"
          else
            curl --fail --silent --show-error \
              --header "Accept: application/json" \
              "$STATUS_URL"
          fi
          echo

      - name: Dispatch verified build to RAY
        shell: bash
        run: |
          set -euo pipefail
          CORE_URL="${RSS_CORE_URL:-https://rsscore.cv}"
          DISPATCH_URL="${RSS_CORE_RAY_DISPATCH_URL:-${CORE_URL%/}/api/v1/ray/dispatch}"

          echo "Dispatching verified RSS File Manager build to RAY: $DISPATCH_URL"

          AUTH_ARGS=()
          if [ -n "${RSS_CORE_TOKEN:-}" ]; then
            AUTH_ARGS=(--header "Authorization: Bearer ${RSS_CORE_TOKEN}")
          else
            echo "::warning::RSS_CORE_TOKEN is not configured; attempting RAY dispatch without authentication."
          fi

          curl --fail --silent --show-error \
            --request POST \
            "${AUTH_ARGS[@]}" \
            --header "Content-Type: application/json" \
            --header "Accept: application/json" \
            --data '{
              "project": "RSS-File-Manager",
              "repository": "riyazamra1/RSS-File-Manager",
              "ref": "'"${GITHUB_SHA}"'",
              "branch": "'"${GITHUB_REF_NAME}"'",
              "event": "android-debug-build",
              "artifact": "rss-file-manager-debug-'"'${GITHUB_SHA}"'"
            }' \
            "$DISPATCH_URL"
          echo
          echo "RAY dispatch request completed."

      - name: Report RAY authentication state
        if: ${{ env.RSS_CORE_TOKEN == '' }}
        run: |
          echo "::warning::RAY dispatch URL is now enabled by default, but RSS_CORE_TOKEN is not configured."
          echo "If RSS Core requires authentication, add repository secret RSS_CORE_TOKEN."
