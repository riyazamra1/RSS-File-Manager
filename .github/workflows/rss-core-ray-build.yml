name: RSS Core + RAY Android Build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rss-file-manager-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build RSS File Manager
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: rss-file-manager-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  rss-core-ray:
    name: RSS Core + RAY dispatch
    needs: build
    runs-on: ubuntu-latest
    env:
      RSS_CORE_URL: ${{ vars.RSS_CORE_URL }}
      RSS_CORE_TOKEN: ${{ secrets.RSS_CORE_TOKEN }}
    steps:
      - name: Check RSS Core
        shell: bash
        run: |
          set -euo pipefail
          CORE_URL="${RSS_CORE_URL:-https://rsscore.cv}"
          STATUS_URL="${CORE_URL%/}/api/v1/status"
          echo "Checking RSS Core: $STATUS_URL"
          if [ -n "${RSS_CORE_TOKEN:-}" ]; then
            curl --fail --silent --show-error --header "Authorization: Bearer ${RSS_CORE_TOKEN}" --header "Accept: application/json" "$STATUS_URL"
          else
            curl --fail --silent --show-error --header "Accept: application/json" "$STATUS_URL"
          fi
          echo

      - name: Dispatch task to RAY
        shell: bash
        run: |
          set -euo pipefail
          CORE_URL="${RSS_CORE_URL:-https://rsscore.cv}"
          DISPATCH_URL="${CORE_URL%/}/api/v1/ray/dispatch"
          test -n "${RSS_CORE_TOKEN:-}" || {
            echo "::error::RSS_CORE_TOKEN is required for RSS Core API authentication."
            exit 1
          }
          PAYLOAD=$(cat <<JSON
          {
            "project": "RSS-File-Manager",
            "task": "Verified Android debug build completed in GitHub Actions for commit ${GITHUB_SHA}. Continue the RSS File Manager development workflow from this repository commit.",
            "command": ["bash", "-lc", "echo RSS File Manager RAY handoff verified for commit ${GITHUB_SHA}"],
            "priority": "normal"
          }
          JSON
          )
          echo "Dispatching to $DISPATCH_URL"
          curl --fail --silent --show-error --request POST \
            --header "Authorization: Bearer ${RSS_CORE_TOKEN}" \
            --header "Content-Type: application/json" \
            --header "Accept: application/json" \
            --data "$PAYLOAD" "$DISPATCH_URL"
          echo
          echo "RAY dispatch accepted by RSS Core."
